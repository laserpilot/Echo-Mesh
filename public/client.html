<!-- public/client.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Mesh - Client</title>
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/client.css">
    <style>
        /* Additional client-specific styles can be added here if needed */
    </style>
</head>

<body>
    <div class="log" id="log"></div>

    <h1>Echo Mesh</h1>
    <div class="client-header">
        <div class="sound-indicator" id="soundIndicator">READY</div>
        <div class="client-id" id="clientId">--</div>
    </div>

    <div class="piano-keyboard" id="pianoKeyboard">
        <!-- Piano keys will be generated by JavaScript -->
    </div>
    <button class="button secondary" id="resyncButton" style="margin-top: 10px;">Re-sync Timing</button>
    <button class="button danger" id="stopMetronomeButton" style="margin-top: 10px; display: none;">Stop Click Track</button>

    <div class="status" id="status">Initializing...</div>

    <script type="module">
        import { ClientApp } from './js/client/client-app.js';
        
        document.addEventListener('DOMContentLoaded', async function () {
            const clientApp = new ClientApp();
            
            try {
                await clientApp.init();
                console.log('Echo Mesh Client started successfully');
            } catch (error) {
                console.error('Failed to start Echo Mesh Client:', error);
            }
        });
    </script>
</body>

</html>
