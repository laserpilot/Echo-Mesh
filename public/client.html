<!-- public/client.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Mesh - Client</title>
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/client.css">
    <style>
        /* Additional client-specific styles can be added here if needed */
    </style>
</head>

<body>
    <!-- Audio activation overlay -->
    <div class="audio-activation-overlay" id="audioActivationOverlay">
        <div class="audio-activation-modal">
            <h2>🎵 Enable Audio</h2>
            <p>Tap to activate audio playback and start your musical experience!</p>
            <button class="audio-activation-button" id="audioActivationButton">
                Enable Audio
            </button>
        </div>
    </div>

    <div class="log" id="log"></div>

    <h1>Echo Mesh</h1>
    <div class="client-header">
        <div class="sound-indicator" id="soundIndicator">READY</div>
        <div class="client-id" id="clientId">--</div>
    </div>

    <div class="piano-keyboard" id="pianoKeyboard">
        <!-- Piano keys will be generated by JavaScript -->
    </div>
    
    <div class="group-assignment" style="margin: 15px 0;">
        <h3 style="margin: 0 0 10px 0; font-size: 16px; text-align: center;">Assign to Group</h3>
        <div class="color-grid" id="colorGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 300px; margin: 0 auto;">
            <button class="color-button" data-group="1" data-color="#ff6b6b" style="background-color: #ff6b6b; color: white; border: 2px solid #ddd; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">Group 1</button>
            <button class="color-button" data-group="2" data-color="#4ecdc4" style="background-color: #4ecdc4; color: white; border: 2px solid #ddd; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">Group 2</button>
            <button class="color-button" data-group="3" data-color="#45b7d1" style="background-color: #45b7d1; color: white; border: 2px solid #ddd; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">Group 3</button>
            <button class="color-button" data-group="4" data-color="#96ceb4" style="background-color: #96ceb4; color: white; border: 2px solid #ddd; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">Group 4</button>
            <button class="color-button" data-group="5" data-color="#ffd93d" style="background-color: #ffd93d; color: white; border: 2px solid #ddd; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">Group 5</button>
            <button class="color-button" data-group="6" data-color="#bd83ce" style="background-color: #bd83ce; color: white; border: 2px solid #ddd; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">Group 6</button>
        </div>
        <div id="currentGroupDisplay" style="text-align: center; margin-top: 10px; font-size: 14px; color: #666;">
            Current group: None
        </div>
    </div>
    
    <button class="button secondary" id="resyncButton" style="margin-top: 10px;">Re-sync Timing</button>
    <button class="button danger" id="stopMetronomeButton" style="margin-top: 10px; display: none;">Stop Click Track</button>

    <div class="status" id="status">Initializing...</div>

    <script type="module">
        import { ClientApp } from './js/client/client-app.js';
        
        document.addEventListener('DOMContentLoaded', async function () {
            const clientApp = new ClientApp();
            
            try {
                await clientApp.init();
                console.log('Echo Mesh Client started successfully');
            } catch (error) {
                console.error('Failed to start Echo Mesh Client:', error);
            }
        });
    </script>
</body>

</html>
